%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/nintendo,wii-ave-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nintendo Wii audio/video encoder GPIO I2C controller

maintainers:
  - Bill Carson <anolisporcatus@gmail.com>

description: |
  The Nintendo Wii connects the Hollywood chipset to its audio/video encoder
  through a GPIO-backed I2C bus. SCL must remain an actively driven output,
  while SDA changes to input only when the master reads acknowledgements or
  data. The generic i2c-gpio open-drain emulation does not provide these line
  direction semantics.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: nintendo,wii-ave-i2c

  sda-gpios:
    description: Hollywood GPIO connected to the encoder data line
    maxItems: 1

  scl-gpios:
    description: Hollywood GPIO connected to the encoder clock line
    maxItems: 1

required:
  - compatible
  - sda-gpios
  - scl-gpios

unevaluatedProperties: false

...
